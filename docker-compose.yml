# 开发环境 docker compose（开箱即用，无需创建 .env）
# 启动：
#   docker compose up -d
#
# 如需自定义配置，创建 .env 覆盖对应变量：
#   cp .env.example .env

services:
  app:
    build:
      context: .
    container_name: fsdx-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/app_web}
      STORAGE_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET:-dev-secret-at-least-32-characters-long}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # 认证 Cookie Secure 标志（可选）：线上未启用 HTTPS 时须设 COOKIE_SECURE=false
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - ./.volumes/app:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
