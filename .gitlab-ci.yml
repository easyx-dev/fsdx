build-and-push:
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      until docker info > /dev/null 2>&1; do
        echo "等待 Docker daemon 就绪..."
        sleep 2
      done
    - docker login -u $PRIVATE_REGISTRY_USER -p $PRIVATE_REGISTRY_PASSWORD $PRIVATE_REGISTRY
  script:
    - |
      DESTINATIONS="ucas/fsdx-web:latest"
      if [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        DESTINATIONS="$DESTINATIONS ucas/fsdx-web:$CI_COMMIT_SHORT_SHA"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="$DESTINATIONS ucas/fsdx-web:$CI_COMMIT_TAG"
      fi
    - |
      for tag in $DESTINATIONS; do
        docker build \
          --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
          -t $PRIVATE_REGISTRY/$tag .
        docker push $PRIVATE_REGISTRY/$tag
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
