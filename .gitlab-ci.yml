build-and-push:
  image:
    name: vyx7n6jknmproy-gcr.xuanyuan.run/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    NPM_REGISTRY: "https://registry.npmmirror.com"
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      DESTINATIONS="--destination $CI_REGISTRY_IMAGE:latest"
      if [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile \
        --build-arg NPM_REGISTRY=$NPM_REGISTRY \
        --insecure-registry=g.ucas.com.cn:8088 \
        --cache=true \
        --cleanup \
        $DESTINATIONS
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
